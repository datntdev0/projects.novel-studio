<div
  class="shell"
  data-testid="app-shell"
  [class.rail-expanded]="layout.railExpanded()"
  [class.no-left]="!layout.shown().left"
  [class.no-right]="!layout.shown().right"
  [class.no-bottom]="!layout.shown().bottom"
  [class.collapsed-left]="layout.shown().left && !layout.open().left"
  [class.collapsed-right]="layout.shown().right && !layout.open().right"
  [class.collapsed-bottom]="layout.shown().bottom && !layout.open().bottom"
  [class.focus]="layout.focusMode()"
  [style.--user-left-w]="layout.current().left ? layout.current().left + 'px' : null"
  [style.--user-right-w]="layout.current().right ? layout.current().right + 'px' : null"
  [style.--user-bottom-h]="layout.current().bottom ? layout.current().bottom + 'px' : null"
>
  <header class="topbar" data-testid="topbar">
    <ns-brand /><ns-crumbs /><span class="spacer"></span
    ><ns-palette-button /><ns-panel-toggles /><ns-appearance-buttons /><ns-settings-button />
  </header>
  <ns-rail [expanded]="layout.railExpanded()" />
  <aside class="panel-left" data-testid="panel-left"><ng-container *ngTemplateOutlet="panels.left()" /></aside>
  <div class="resizer left" data-testid="resizer-left" nsResizer="left"></div>
  <main class="workspace" data-testid="workspace"><router-outlet /></main>
  <div class="resizer right" data-testid="resizer-right" nsResizer="right"></div>
  <aside class="panel-right" data-testid="panel-right"><ng-container *ngTemplateOutlet="panels.right()" /></aside>
  <div class="resizer bottom" data-testid="resizer-bottom" nsResizer="bottom"></div>
  <section class="panel-bottom" data-testid="panel-bottom"><ng-container *ngTemplateOutlet="panels.bottom()" /></section>
  <ns-status-bar />
  <ns-focus-bar />
</div>
<ns-toast-outlet />
<ns-confirm-outlet />
<ns-palette />
<ns-shortcut-sheet />
