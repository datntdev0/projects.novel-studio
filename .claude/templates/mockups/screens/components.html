    <!-- ================= reference: components ================= -->
    <section class="screen" id="components" data-title="Components">
      <header class="screen-header"><h1>Components</h1><p class="muted">Living inventory — every component used by a screen appears here with its states.</p></header>
      <div class="frame">
        <h3>Buttons</h3>
        <div class="row">
          <button class="btn primary">Primary</button>
          <button class="btn">Secondary</button>
          <button class="btn ghost">Ghost</button>
          <button class="btn" disabled>Disabled</button>
        </div>
        <h3>Form field</h3>
        <div class="field"><label>Label</label><input placeholder="Placeholder"><small>Helper text</small></div>
        <div class="field error"><label>Label</label><input value="Bad value"><small>Error message</small></div>
        <h3>Card</h3>
        <div class="card"><h4>Card title</h4><p>Body text.</p></div>
        <h3>Status</h3>
        <div class="row"><span class="status ok">ok</span><span class="status warn">warn</span><span class="status bad">bad</span><span class="status info">info</span></div>
      </div>
    </section>
